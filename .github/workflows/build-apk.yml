name: Build Lumina Gallery Release APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - 
- name: Set Up Android SDK
  uses: android-actions/setup-android@v4


      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Add Android 37.0 SDK alias for compileSdk 37
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          test -d "$SDK_ROOT/platforms/android-37.0"
          ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk LuminaGallery-v4-Pro-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaGallery-v4-Pro-APK
          path: LuminaGallery-v4-Pro-unsigned.apk
          if-no-files-found: error
          retention-days: 30
