
name: Build Lumina Gallery Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: lumina-gallery-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

jobs:
  release-apk:
    name: Build Lumina Gallery APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 3. Set up Android SDK
      - name: Set Up Android SDK
        uses: android-actions/setup-android@v4

      # 4. Verify Android SDK tools
      - name: Verify Android SDK
        run: |
          echo "Android SDK Root: $ANDROID_SDK_ROOT"
          echo "Java Version:"
          java -version
          echo "SDK Manager:"
          command -v sdkmanager
          sdkmanager --version

      # 5. Install Gradle 9.6.0
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic
          validate-wrappers: false

      # 6. Build Release APK
      - name: Build Release APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease

      # 7. Locate and prepare APK
      - name: Prepare APK Artifact
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find app/build/outputs/apk/release \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            echo "Available build outputs:"
            find app/build/outputs -type f || true
            exit 1
          fi

          mkdir -p release

          cp "$APK_PATH" \
            release/LuminaGallery-v4-Pro-release.apk

          echo "APK successfully prepared:"
          ls -lh release/

      # 8. Upload APK as ZIP artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: LuminaGallery-v4-Pro-APK
          path: release/LuminaGallery-v4-Pro-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
